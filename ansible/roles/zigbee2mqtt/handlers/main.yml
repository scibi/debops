# A separate handler is needed to ensure the correct order of execution
- name: Reload systemd daemon (zigbee2mqtt)
  systemd:
    daemon_reload: True
  when: ansible_service_mgr == 'systemd'

- name: Restart zigbee2mqtt
  service:
    name: 'zigbee2mqtt'
    state: 'restarted'
    enabled: True
