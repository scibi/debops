- name: Prepare garage environment
  ansible.builtin.set_fact:
    garage__env_etc_services_dependent_list: '{{ lookup("template",
                                                 "lookup/garage__env_etc_services_dependent_list.j2",
                                                 convert_data=False) | from_yaml }}'
    garage__env_ferm_dependent_rules:        '{{ lookup("template",
                                                 "lookup/garage__env_ferm_dependent_rules.j2",
                                                 convert_data=False) | from_yaml }}'
    garage__env_nginx_dependent_upstreams:   '{{ lookup("template",
                                                 "lookup/garage__env_nginx_dependent_upstreams.j2",
                                                 convert_data=False) | from_yaml }}'
    garage__env_nginx_dependent_servers:     '{{ lookup("template",
                                                 "lookup/garage__env_nginx_dependent_servers.j2",
                                                 convert_data=False) | from_yaml }}'
