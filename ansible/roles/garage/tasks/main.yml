- name: Import custom Ansible plugins
  ansible.builtin.import_role:
    name: 'ansible_plugins'

- name: Import DebOps global handlers
  ansible.builtin.import_role:
    name: 'global_handlers'

- name: Import DebOps secret role
  ansible.builtin.import_role:
    name: 'secret'

- name: Pre hooks
  ansible.builtin.include_tasks: '{{ lookup("debops.debops.task_src", "garage/pre_main.yml") }}'

- name: Make sure that Ansible local fact directory exists
  ansible.builtin.file:
    path: '/etc/ansible/facts.d'
    state: 'directory'
    mode: '0755'

- name: Create garage system group
  ansible.builtin.group:
    name: '{{ garage__group }}'
    state: 'present'
    system: True
  when: garage__deploy_state != 'absent'

- name: Create garage system user
  ansible.builtin.user:
    name: '{{ garage__user }}'
    group: '{{ garage__group }}'
    home: '{{ garage__home }}'
    shell: '{{ garage__shell }}'
    system: True
    create_home: True
    state: 'present'
  when: garage__deploy_state != 'absent'

- name: Create garage secret directory
  ansible.builtin.file:
    path: '{{ garage__secret_dir }}'
    state: 'directory'
    owner: 'root'
    group: '{{ garage__group }}'
    mode: '0750'
  when: garage__deploy_state != 'absent'

- name: Create garage home directory
  ansible.builtin.file:
    path: '{{ garage__home }}'
    state: 'directory'
    owner: '{{ garage__user }}'
    group: '{{ garage__group }}'
    mode: '0750'
  when: garage__deploy_state != 'absent'

- name: Create garage metadata directory
  ansible.builtin.file:
    path: '{{ garage__metadata_dir }}'
    state: 'directory'
    owner: '{{ garage__user }}'
    group: '{{ garage__group }}'
    mode: '0750'
  when: garage__deploy_state != 'absent'

- name: Create garage data directory
  ansible.builtin.file:
    path: '{{ garage__data_dir }}'
    state: 'directory'
    owner: '{{ garage__user }}'
    group: '{{ garage__group }}'
    mode: '0750'
  when: garage__deploy_state != 'absent'

- name: Create garage metadata snapshots directory
  ansible.builtin.file:
    path: '{{ garage__metadata_snapshots_dir }}'
    state: 'directory'
    owner: '{{ garage__user }}'
    group: '{{ garage__group }}'
    mode: '0750'
  when:
    - garage__deploy_state != 'absent'
    - garage__metadata_snapshots_dir | length > 0

- name: Create garage download cache directory
  ansible.builtin.file:
    path: '{{ garage__cache_dir }}'
    state: 'directory'
    owner: 'root'
    group: 'root'
    mode: '0755'
  when:
    - garage__deploy_state != 'absent'
    - not (garage__skip_install | bool)

- name: Assert host architecture is supported by garage
  ansible.builtin.assert:
    that:
      - ansible_architecture in garage__arch_map
    fail_msg: >-
      garage has no release binary for architecture
      '{{ ansible_architecture }}'. Supported uname architectures:
      {{ garage__arch_map.keys() | list | sort }}.
  when:
    - garage__deploy_state != 'absent'
    - not (garage__skip_install | bool)

- name: Assert garage cluster parameters are consistent
  ansible.builtin.assert:
    that:
      - (hostvars[item]['garage__replication_factor']
         | d(garage__replication_factor) | int)
        == (garage__replication_factor | int)
      - (hostvars[item]['garage__cluster_name']
         | d(garage__cluster_name))
        == garage__cluster_name
    quiet: True
    fail_msg: >-
      Host {{ item }} has garage__replication_factor=
      {{ hostvars[item]['garage__replication_factor'] | d('unset') }}
      and garage__cluster_name=
      {{ hostvars[item]['garage__cluster_name'] | d('unset') }},
      which does not match this host
      ({{ garage__replication_factor }}/{{ garage__cluster_name }}).
      Both must be identical on every member of
      [debops_service_garage] because rpc_secret and the layout quorum
      are cluster-wide.
  loop: '{{ groups["debops_service_garage"] | d([]) }}'
  loop_control:
    label: '{{ item }}'
  when: garage__deploy_state != 'absent'

- name: Assert single-node bootstrap will not crash the daemon
  ansible.builtin.assert:
    that:
      - (ansible_local.garage.layout_version | d(0) | int) <= 1
    quiet: True
    fail_msg: >-
      Garage layout version is
      {{ ansible_local.garage.layout_version | d('unknown') }},
      which is greater than 1. The daemon refuses to start with
      --single-node in that state and would enter a crash loop.
      Set garage__single_node: False before the next run.
  when:
    - garage__deploy_state != 'absent'
    - garage__single_node | bool

- name: Assert single-node bootstrap matches replication_factor
  ansible.builtin.assert:
    that:
      - garage__replication_factor | int == 1
    quiet: True
    fail_msg: >-
      --single-node requires garage__replication_factor == 1
      (currently {{ garage__replication_factor }}). Either lower
      the replication factor or set garage__single_node: False.
  when:
    - garage__deploy_state != 'absent'
    - garage__single_node | bool

- name: Install garage binary
  ansible.builtin.include_tasks: 'install_binary.yml'
  when:
    - garage__deploy_state != 'absent'
    - not (garage__skip_install | bool)

- name: Deploy garage secret files
  ansible.builtin.copy:
    dest: '{{ item.dest }}'
    content: '{{ item.content }}'
    owner: '{{ garage__user }}'
    group: '{{ garage__group }}'
    mode: '0600'
  no_log: True
  loop:
    - dest: '{{ garage__secret_dir }}/rpc_secret'
      content: '{{ garage__rpc_secret }}'
    - dest: '{{ garage__secret_dir }}/admin_token'
      content: '{{ garage__admin_token }}'
    - dest: '{{ garage__secret_dir }}/metrics_token'
      content: '{{ garage__metrics_token }}'
  loop_control:
    label: '{{ item.dest }}'
  register: garage__register_secrets
  when: garage__deploy_state != 'absent'

- name: Deploy garage default-bucket credentials
  ansible.builtin.template:
    src: 'etc/garage/default-credentials.env.j2'
    dest: '{{ garage__secret_dir }}/default-credentials.env'
    owner: 'root'
    group: 'root'
    mode: '0600'
  no_log: True
  register: garage__register_credentials
  when:
    - garage__deploy_state != 'absent'
    - garage__default_bucket | length > 0

- name: Remove leftover default-bucket credentials
  ansible.builtin.file:
    path: '{{ garage__secret_dir }}/default-credentials.env'
    state: 'absent'
  when:
    - garage__deploy_state != 'absent'
    - garage__default_bucket | length == 0

- name: Deploy garage configuration
  ansible.builtin.template:
    src: 'etc/garage.toml.j2'
    dest: '{{ garage__config_file }}'
    owner: 'root'
    group: '{{ garage__group }}'
    mode: '0640'
  register: garage__register_config
  when: garage__deploy_state != 'absent'

- name: Save garage local facts
  ansible.builtin.template:
    src: 'etc/ansible/facts.d/garage.fact.j2'
    dest: '/etc/ansible/facts.d/garage.fact'
    mode: '0755'
  notify: [ 'Refresh host facts' ]
  tags: [ 'meta::facts' ]

- name: Reload Ansible local facts
  ansible.builtin.meta: 'flush_handlers'

- name: Install garage systemd unit
  ansible.builtin.template:
    src: 'etc/systemd/system/garage.service.j2'
    dest: '/etc/systemd/system/garage.service'
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: garage__register_unit
  notify: [ 'Reload service manager' ]
  when: garage__deploy_state != 'absent'

- name: Stop and disable garage service
  ansible.builtin.systemd:
    name: 'garage.service'
    enabled: False
    state: 'stopped'
  register: garage__register_absent_stop
  failed_when:
    - garage__register_absent_stop is failed
    - "'Could not find the requested service' not in (garage__register_absent_stop.msg | d(''))"
    - (garage__register_absent_stop.status.LoadState | d('')) != 'not-found'
  when: garage__deploy_state == 'absent'

- name: Remove garage systemd unit
  ansible.builtin.file:
    path: '/etc/systemd/system/garage.service'
    state: 'absent'
  notify: [ 'Reload service manager' ]
  when: garage__deploy_state == 'absent'

- name: Flush handlers before managing the service
  ansible.builtin.meta: 'flush_handlers'

- name: Manage garage systemd service
  ansible.builtin.systemd:  # noqa no-handler
    name: 'garage.service'
    enabled: True
    daemon_reload: '{{ garage__register_unit is changed }}'
    state: '{{ "restarted"
               if (garage__register_config is changed
                   or garage__register_unit is changed
                   or garage__register_secrets is changed
                   or ((garage__register_credentials | d({})).changed | d(False))
                   or ((garage__register_binary | d({})).changed | d(False)))
               else "started" }}'
  when: garage__deploy_state != 'absent'

- name: Remove garage binary when deploy state is absent
  ansible.builtin.file:
    path: '{{ garage__bin_path }}'
    state: 'absent'
  when: garage__deploy_state == 'absent'

- name: Remove garage configuration when deploy state is absent
  ansible.builtin.file:
    path: '{{ item }}'
    state: 'absent'
  loop:
    - '{{ garage__config_file }}'
    - '{{ garage__secret_dir }}'
  when: garage__deploy_state == 'absent'

- name: Post hooks
  ansible.builtin.include_tasks: '{{ lookup("debops.debops.task_src", "garage/post_main.yml") }}'
